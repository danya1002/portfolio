<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Яндекс.Почта — Входящие</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: #E5EAF0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    font-size: 14px;
  }

  .mail-app {
    width: 1000px;
    max-width: 100%;
    height: 800px;
    max-height: 96vh;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.04);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ===== HEADER ===== */
  .header {
    height: 52px;
    background: #FC3F1D;
    display: flex;
    align-items: center;
    padding: 0 16px;
    flex-shrink: 0;
    justify-content: space-between;
    gap: 12px;
  }

  .header-left { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }

  .ya-logo {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #fff;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.4px;
    cursor: default;
    user-select: none;
  }

  .ya-logo svg { flex-shrink: 0; }

  .header-search-wrap {
    position: relative;
    flex: 1;
    max-width: 340px;
  }

  .header-search {
    width: 100%;
    background: rgba(255,255,255,0.18);
    border: none;
    border-radius: 20px;
    padding: 6px 14px 6px 34px;
    color: #fff;
    font-size: 13px;
    outline: none;
    transition: background 0.2s;
  }

  .header-search:focus { background: rgba(255,255,255,0.30); }
  .header-search::placeholder { color: rgba(255,255,255,0.55); }

  .header-search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(255,255,255,0.55);
    font-size: 13px;
    pointer-events: none;
  }

  .header-right { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }

  .header-btn {
    color: #fff;
    cursor: pointer;
    opacity: 0.80;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: none;
    background: none;
    font-size: 16px;
    transition: background 0.15s, opacity 0.15s;
  }

  .header-btn:hover { background: rgba(255,255,255,0.15); opacity: 1; }

  .header-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(255,255,255,0.20);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-left: 4px;
    transition: background 0.2s;
    border: none;
  }

  .header-avatar:hover { background: rgba(255,255,255,0.35); }

  /* ===== BODY LAYOUT ===== */
  .body { display: flex; flex: 1; overflow: hidden; }

  /* ===== SIDEBAR ===== */
  .sidebar {
    width: 210px;
    background: #F7F9FC;
    border-right: 1px solid #E2E8F0;
    padding: 14px 10px;
    overflow-y: auto;
    flex-shrink: 0;
  }

  .compose-btn {
    width: 100%;
    padding: 10px 0;
    background: #FC3F1D;
    color: #fff;
    border: none;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .compose-btn:hover { background: #E63518; }
  .compose-btn:active { transform: scale(0.98); }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    color: #333;
    font-weight: 500;
    transition: background 0.12s;
    user-select: none;
  }

  .nav-item:hover { background: #E8EDF4; }
  .nav-item:active { background: #DDE4ED; }

  .nav-item.active {
    background: #FEE9E5;
    color: #FC3F1D;
    font-weight: 600;
  }

  .nav-item .icon { font-size: 17px; width: 22px; text-align: center; flex-shrink: 0; }

  .nav-item .badge {
    margin-left: auto;
    background: #FC3F1D;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 1px 7px;
    border-radius: 10px;
    line-height: 16px;
  }

  .sidebar-divider { height: 1px; background: #E2E8F0; margin: 10px 0; }

  .folders-label {
    font-size: 11px;
    text-transform: uppercase;
    color: #8E9CAB;
    font-weight: 600;
    padding: 4px 12px;
    letter-spacing: 0.5px;
  }

  /* ===== INBOX AREA ===== */
  .inbox-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; position: relative; }

  /* ===== TOOLBAR ===== */
  .toolbar {
    height: 46px;
    border-bottom: 1px solid #E2E8F0;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 2px;
    flex-shrink: 0;
    background: #FBFCFD;
  }

  .toolbar input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: #FC3F1D;
    cursor: pointer;
    margin-right: 4px;
    flex-shrink: 0;
  }

  .toolbar-btn {
    background: none;
    border: none;
    padding: 5px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: #555;
    font-weight: 500;
    transition: background 0.12s;
    white-space: nowrap;
  }

  .toolbar-btn:hover { background: #E8EDF4; }
  .toolbar-btn:active { background: #DDE4ED; }

  .toolbar-sep { width: 1px; height: 22px; background: #E2E8F0; margin: 0 4px; flex-shrink: 0; }

  .toolbar-spacer { flex: 1; min-width: 8px; }

  .toolbar .count {
    font-size: 12px;
    color: #8E9CAB;
    margin-right: 6px;
    white-space: nowrap;
  }

  .toolbar .pagination { display: flex; align-items: center; gap: 2px; }

  .page-btn {
    width: 28px;
    height: 28px;
    border: none;
    background: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    color: #555;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.12s;
  }

  .page-btn:hover { background: #E8EDF4; }
  .page-btn:disabled { opacity: 0.3; cursor: default; }
  .page-btn:disabled:hover { background: none; }

  /* ===== EMAIL LIST ===== */
  .email-list { flex: 1; overflow-y: auto; }

  .email-row {
    display: flex;
    align-items: center;
    padding: 9px 14px;
    cursor: pointer;
    border-bottom: 1px solid #F0F4F8;
    transition: background 0.08s;
    min-height: 50px;
    gap: 10px;
  }

  .email-row:hover { background: #F4F7FA; }

  .email-row.unread { background: #fff; }
  .email-row.unread .from { font-weight: 700; color: #111; }
  .email-row.unread .subject { font-weight: 600; color: #1a1a1a; }
  .email-row.unread .date-text { font-weight: 600; color: #111; }

  .email-row .cb { flex-shrink: 0; }
  .email-row .cb input { width: 16px; height: 16px; accent-color: #FC3F1D; cursor: pointer; }

  .email-row .avatar-wrap { flex-shrink: 0; }

  .email-row .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    flex-shrink: 0;
    user-select: none;
  }

  .avatar.orange { background: linear-gradient(135deg, #FF8C00, #FF4500); }
  .avatar.green  { background: linear-gradient(135deg, #00B09B, #96C93D); }
  .avatar.blue   { background: linear-gradient(135deg, #4FACFE, #00F2FE); }
  .avatar.purple { background: linear-gradient(135deg, #A18CD1, #FBC2EB); }
  .avatar.gray   { background: linear-gradient(135deg, #B0BEC5, #90A4AE); }
  .avatar.red    { background: linear-gradient(135deg, #E53935, #EF5350); }

  .email-row .from-wrap { min-width: 0; flex-shrink: 0; width: 190px; }

  .email-row .from {
    font-size: 14px;
    color: #333;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .email-row .subject-wrap {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .email-row .subject {
    font-size: 14px;
    color: #444;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .email-row .subject .label {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    padding: 0 5px;
    border-radius: 3px;
    margin-right: 4px;
    vertical-align: middle;
    line-height: 16px;
  }

  .label.work { background: #E3F2FD; color: #1565C0; }

  .email-row .date-wrap {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: 8px;
  }

  .email-row .date-text {
    font-size: 12px;
    color: #8E9CAB;
    white-space: nowrap;
  }

  .email-row .pin-icon {
    color: #FC3F1D;
    font-size: 12px;
    flex-shrink: 0;
  }

  /* ===== EMAIL READER ===== */
  .email-reader {
    display: none;
    flex: 1;
    flex-direction: column;
    overflow: hidden;
    background: #fff;
  }

  .email-reader.open { display: flex; }

  .reader-scroll { padding: 24px 32px; flex: 1; overflow-y: auto; }

  .reader-back {
    display: none;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    font-size: 13px;
    color: #FC3F1D;
    cursor: pointer;
    font-weight: 500;
    padding: 4px 0;
    margin-bottom: 12px;
  }

  .reader-back:hover { text-decoration: underline; }

  .reader-header { border-bottom: 1px solid #E8EDF4; padding-bottom: 18px; margin-bottom: 18px; }

  .reader-subject {
    font-size: 22px;
    font-weight: 700;
    color: #111;
    margin-bottom: 14px;
    line-height: 1.3;
    word-break: break-word;
  }

  .reader-from {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    position: relative;
  }

  .reader-from .avatar { width: 48px; height: 48px; font-size: 18px; flex-shrink: 0; }

  .reader-from .info-wrap { flex: 1; min-width: 0; }

  .reader-from .name {
    font-size: 15px;
    font-weight: 600;
    color: #111;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .reader-from .email {
    font-size: 13px;
    color: #8E9CAB;
  }

  .reader-from .to-me {
    font-size: 13px;
    color: #8E9CAB;
    margin-top: 1px;
  }

  .reader-from .to-me span { color: #1565C0; cursor: pointer; }
  .reader-from .to-me span:hover { text-decoration: underline; }

  .reader-from .date-right {
    position: absolute;
    top: 0;
    right: 0;
    font-size: 12px;
    color: #8E9CAB;
    text-align: right;
  }

  .reader-body {
    font-size: 15px;
    line-height: 1.7;
    color: #222;
    font-family: 'Segoe UI', Arial, sans-serif;
    word-wrap: break-word;
  }

  .reader-body strong { color: #111; }

  .reader-body .vacancy-block {
    background: #F7F9FC;
    border: 1px solid #E2E8F0;
    border-radius: 10px;
    padding: 16px 18px;
    margin: 16px 0;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }

  .reader-body .vacancy-block:hover { background: #F0F4FA; border-color: #C8D0DC; }

  .reader-body .vacancy-block .v-title {
    font-size: 16px;
    font-weight: 700;
    color: #1565C0;
    margin-bottom: 6px;
  }

  .reader-body .vacancy-block .v-company {
    font-size: 14px;
    font-weight: 600;
    color: #333;
  }

  .reader-body .vacancy-block .v-salary {
    font-size: 15px;
    font-weight: 700;
    color: #2E7D32;
    margin: 6px 0;
  }

  .reader-body .vacancy-block .v-desc {
    font-size: 13px;
    color: #555;
    line-height: 1.5;
    margin-top: 4px;
  }

  .reader-body .vacancy-block .v-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }

  .reader-body .vacancy-block .v-tag {
    background: #E3F2FD;
    color: #1565C0;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 12px;
    font-weight: 500;
  }

  .reader-body .vacancy-block .v-sub {
    font-size: 13px;
    color: #555;
    margin-top: 2px;
  }

  .reader-body .vacancy-sep {
    border: none;
    border-top: 1px dashed #D0D8E0;
    margin: 18px 0;
  }

  .reader-actions {
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid #E8EDF4;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding-bottom: 8px;
  }

  .reader-actions button {
    padding: 8px 18px;
    border-radius: 20px;
    border: 1px solid #D0D8E0;
    background: #fff;
    font-size: 13px;
    font-weight: 500;
    color: #333;
    cursor: pointer;
    transition: all 0.12s;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .reader-actions button:hover { background: #F4F7FA; border-color: #B0BEC5; }
  .reader-actions button:active { background: #E8EDF4; }

  .reader-actions button.primary {
    background: #FC3F1D;
    color: #fff;
    border-color: #FC3F1D;
  }

  .reader-actions button.primary:hover { background: #E63518; border-color: #E63518; }

  /* ===== COMPOSE MODAL ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.35);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-overlay.open { display: flex; }

  .modal-box {
    background: #fff;
    border-radius: 12px;
    width: 600px;
    max-width: 100%;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 12px 48px rgba(0,0,0,0.18);
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid #E2E8F0;
  }

  .modal-header h3 { font-size: 16px; font-weight: 600; color: #111; }

  .modal-close {
    width: 32px; height: 32px;
    border: none; background: none;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    color: #666;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.12s;
  }

  .modal-close:hover { background: #F0F4F8; }

  .modal-body { padding: 14px 18px; flex: 1; overflow-y: auto; }

  .modal-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid #F0F4F8;
  }

  .modal-row label {
    font-size: 13px;
    font-weight: 500;
    color: #8E9CAB;
    width: 44px;
    flex-shrink: 0;
  }

  .modal-row input, .modal-row textarea {
    flex: 1;
    border: none;
    outline: none;
    font-size: 14px;
    padding: 4px 0;
    font-family: inherit;
    background: none;
  }

  .modal-row textarea {
    min-height: 180px;
    resize: vertical;
    line-height: 1.5;
  }

  .modal-footer {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 18px;
    border-top: 1px solid #E2E8F0;
  }

  .modal-footer .send-btn {
    background: #FC3F1D;
    color: #fff;
    border: none;
    padding: 8px 28px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }

  .modal-footer .send-btn:hover { background: #E63518; }

  .modal-footer .cancel-btn {
    background: none;
    border: none;
    font-size: 13px;
    color: #666;
    cursor: pointer;
    padding: 8px 12px;
  }

  .modal-footer .cancel-btn:hover { color: #111; }

  /* ===== SCROLLBARS ===== */
  .email-list::-webkit-scrollbar,
  .reader-scroll::-webkit-scrollbar,
  .sidebar::-webkit-scrollbar,
  .modal-body::-webkit-scrollbar { width: 6px; }

  .email-list::-webkit-scrollbar-track,
  .reader-scroll::-webkit-scrollbar-track,
  .sidebar::-webkit-scrollbar-track,
  .modal-body::-webkit-scrollbar-track { background: transparent; }

  .email-list::-webkit-scrollbar-thumb,
  .reader-scroll::-webkit-scrollbar-thumb,
  .sidebar::-webkit-scrollbar-thumb,
  .modal-body::-webkit-scrollbar-thumb { background: #C8D0DC; border-radius: 4px; }

  .email-list::-webkit-scrollbar-thumb:hover,
  .reader-scroll::-webkit-scrollbar-thumb:hover,
  .sidebar::-webkit-scrollbar-thumb:hover,
  .modal-body::-webkit-scrollbar-thumb:hover { background: #A8B4C4; }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #323232;
    color: #fff;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 2000;
    pointer-events: none;
    box-shadow: 0 4px 16px rgba(0,0,0,0.20);
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ===== NEW EMAIL ANIMATION ===== */
  @keyframes emailAppear {
    0% { background: #FFF8E1; transform: translateX(-10px); opacity: 0.5; }
    50% { background: #FFF3CD; transform: translateX(3px); }
    100% { background: #fff; transform: translateX(0); opacity: 1; }
  }

  .email-row.new-email {
    animation: emailAppear 1.2s ease-out;
  }

  /* ===== NOTIFICATION BANNER ===== */
  .notif-banner {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    background: linear-gradient(135deg, #FC3F1D, #E63518);
    color: #fff;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 500;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(252,63,29,0.3);
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }

  .notif-banner.show { display: flex; }

  .notif-banner .notif-icon {
    font-size: 22px;
    flex-shrink: 0;
  }

  .notif-banner .notif-text { flex: 1; }
  .notif-banner .notif-text strong { color: #fff; }
  .notif-banner .notif-close {
    background: none;
    border: none;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    opacity: 0.7;
    padding: 0 4px;
  }
  .notif-banner .notif-close:hover { opacity: 1; }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 720px) {
    body { padding: 0; }
    .mail-app { border-radius: 0; height: 100vh; max-height: 100vh; }
    .sidebar { width: 50px; padding: 10px 6px; }
    .sidebar .nav-item span:not(.icon) { display: none; }
    .sidebar .folders-label { display: none; }
    .sidebar .compose-btn { padding: 8px; border-radius: 50%; width: 36px; height: 36px; margin: 0 auto 10px; }
    .sidebar .compose-btn span:not(.icon-span) { display: none; }
    .sidebar .nav-item { justify-content: center; padding: 8px; }
    .email-row .from-wrap { width: 100px; }
    .reader-scroll { padding: 16px; }
    .reader-from .date-right { position: static; margin-top: 6px; text-align: left; }
  }
</style>
</head>
<body>

<div class="mail-app">

  <!-- ===== HEADER ===== -->
  <div class="header">
    <div class="header-left">
      <div class="ya-logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="11" fill="#fff"/>
          <text x="12" y="16" text-anchor="middle" font-size="13" font-weight="bold" fill="#FC3F1D">Я</text>
        </svg>
        Яндекс.Почта
      </div>
    </div>

    <div class="header-search-wrap">
      <span class="header-search-icon">&#128269;</span>
      <input class="header-search" type="text" placeholder="Поиск в почте" oninput="filterEmails(this.value)">
    </div>

    <div class="header-right">
      <button class="header-btn" title="Настройки">&#9881;</button>
      <button class="header-btn" title="Помощь">&#63;</button>
      <button class="header-avatar" title="Аккаунт">ДХ</button>
    </div>
  </div>

  <!-- ===== BODY ===== -->
  <div class="body">

          '<p style="margin:0 0 18px 0;">\u0421\u0440\u043E\u043A \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u044F \u0441\u0430\u043C\u043E\u0439 \u0441\u043F\u0440\u0430\u0432\u043A\u0438 \u0441\u043E\u0441\u0442\u0430\u0432\u043B\u044F\u0435\u0442 30 \u043A\u0430\u043B\u0435\u043D\u0434\u0430\u0440\u043D\u044B\u0445 \u0434\u043D\u0435\u0439 \u0441 \u0434\u0430\u0442\u044B \u0435\u0451 \u0432\u044B\u0434\u0430\u0447\u0438. \u041F\u043E\u0441\u043B\u0435 \u043F\u043E\u043B\u0443\u0447\u0435\u043D\u0438\u044F \u0432\u043D\u0438\u043C\u0430\u0442\u0435\u043B\u044C\u043D\u043E \u043F\u0440\u043E\u0432\u0435\u0440\u044C\u0442\u0435 \u043F\u0440\u0430\u0432\u0438\u043B\u044C\u043D\u043E\u0441\u0442\u044C \u0443\u043A\u0430\u0437\u0430\u043D\u0438\u044F \u0412\u0430\u0448\u0438\u0445 \u0434\u0430\u043D\u043D\u044B\u0445: \u0444\u0430\u043C\u0438\u043B\u0438\u0438, \u0438\u043C\u0435\u043D\u0438, \u043E\u0442\u0447\u0435\u0441\u0442\u0432\u0430, \u043D\u0430\u0438\u043C\u0435\u043D\u043E\u0432\u0430\u043D\u0438\u044F \u043E\u0431\u0440\u0430\u0437\u043E\u0432\u0430\u0442\u0435\u043B\u044C\u043D\u043E\u0439 \u043E\u0440\u0433\u0430\u043D\u0438\u0437\u0430\u0446\u0438\u0438, \u043F\u0435\u0440\u0438\u043E\u0434\u0430 \u043E\u0431\u0443\u0447\u0435\u043D\u0438\u044F \u0438 \u0441\u0443\u043C\u043C\u044B \u0441\u0442\u0438\u043F\u0435\u043D\u0434\u0438\u0438. \u0415\u0441\u043B\u0438 \u0412\u044B \u043E\u0431\u043D\u0430\u0440\u0443\u0436\u0438\u0442\u0435 \u043A\u0430\u043A\u0443\u044E-\u043B\u0438\u0431\u043E \u043E\u0448\u0438\u0431\u043A\u0443 \u0438\u043B\u0438 \u043D\u0435\u0442\u043E\u0447\u043D\u043E\u0441\u0442\u044C, \u043F\u043E\u0436\u0430\u043B\u0443\u0439\u0441\u0442\u0430, \u0441\u0440\u0430\u0437\u0443 \u0436\u0435 \u0441\u043E\u043E\u0431\u0449\u0438\u0442\u0435 \u043E\u0431 \u044D\u0442\u043E\u043C \u0441\u043E\u0442\u0440\u0443\u0434\u043D\u0438\u043A\u0443 \u0443\u0447\u0435\u0431\u043D\u043E\u0433\u043E \u043E\u0442\u0434\u0435\u043B\u0430, \u0447\u0442\u0           '<p style="margin:0 0 18px 0;">\u041E\u0431\u0440\u0430\u0449\u0430\u0435\u043C \u0412\u0430\u0448\u0435 \u0432\u043D\u0438\u043C\u0430\u043D\u0438\u0435, \u0447\u0442\u043E \u0434\u0430\u043D\u043D\u0430\u044F \u0441\u043F\u0440\u0430\u0432\u043A\u0430 \u043F\u0440\u0435\u0434\u043E\u0441\u0442\u0430\u0432\u043B\u044F\u0435\u0442\u0441\u044F \u0431\u0435\u0441\u043F\u043B\u0430\u0442\u043D\u043E. \u0412 \u0441\u043B\u0443\u0447\u0430\u0435 \u0443\u0442\u0435\u0440\u0438 \u0438\u043B\u0438 \u043F\u043E\u0432\u0440\u0435\u0436\u0434\u0435\u043D\u0438\u044F \u043F\u043E\u043B\u0443\u0447\u0435\u043D\u043D\u043E\u0433\u043E \u0434\u043E\u043A\u0443\u043C\u0435\u043D\u0442\u0430 \u0432\u044B \u043C\u043E\u0436\u0435\u0442\u0435 \u0437\u0430\u043A\u0430\u0437\u0430\u0442\u044C \u0434\u0443\u0431\u043B\u0438\u043A\u0430\u0442, \u043D\u0430\u043F\u0440\u0430\u0432\u0438\u0432 \u043F\u0438\u0441\u044C\u043C\u0435\u043D\u043D\u043E\u0435 \u043E\u0431\u0440\u0430\u0449\u0435\u043D\u0438\u0435 \u0432 \u0443\u0447\u0435\u0431\u043D\u044B\u0439 \u043E\u0442\u0434\u0435\u043B. \u041F\u043E \u043B\u044E\u0431\u044B\u043C \u0432\u043E\u043F\u0440\u043E\u0441\u0430\u043C, \u0441\u0432\u044F\u0437\u0430\u043D\u043D\u044B\u043C \u0441 \u0440\u0430\u0431\u043E\u0442\u043E\u0439 \u0441\u0438\u0441\u0442\u0435\u043C\u044B \u00AB\u041A\u041E\u041C\u041F\u0410\u0421\u00BB, \u0412\u044B \u043C\u043E\u0436\u0435\u0442\u0435 \u043E\u0431\u0440\u0430\u0449\u0430\u0442\u044C\u0441\u044F \u0432 \u0442\u0435\u0445\u043D\u0438\u0447\u0435\u0441\u043A\u0443\u044E \u043F\u043E\u0434\u0434\u0435\u0440\u0436\u043A\u0443 \u043F\u043E \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0443 8 (495) 111-22-33 \u0438\u043B\u0438 \u043F\u043E \u044D\u043B\u0435\u043A\u0442\u0440\u043E\u043D\u043D\u043E\u0439 \u043F\u043E\u0447\u0442\u0435 kompas@kait20.ru. \u0422\u0435\u0445\u043D\u0438\u0447\u0435\u0441\u043A\u0430\u044F \u043F\u043E\u0434\u0434\u0435\u0440\u0436\u043A\u0430 \u0440\u0430\u0431\u043E\u04         '<div style="background:#fff;padding:30px 32px 24px;color:#333;font-size:15px;line-height:1.75;">' +

          '<p style="margin:0 0 18px 0;"><strong>\u0423\u0432\u0430\u0436\u0430\u0435\u043C\u044B\u0439 \u0425\u043B\u0435\u0431\u043D\u0438\u043A\u043E\u0432 \u0414\u0430\u043D\u0438\u0438\u043B!</strong></p>' +

          '<p style="margin:0 0 16px 0;">\u0414\u043E\u0431\u0440\u043E\u0435 \u0443\u0442\u0440\u043E! \u041C\u0435\u043D\u044F \u0437\u043E\u0432\u0443\u0442 <strong>\u042F\u0440\u043E\u0441\u043B\u0430\u0432 \u041D\u0438\u043A\u043E\u043B\u0430\u0435\u0432</strong>, \u044F \u044F\u0432\u043B\u044F\u044E\u0441\u044C \u0440\u0430\u0431\u043E\u0442\u043E\u0434\u0430\u0442\u0435\u043B\u0435\u043C \u0432 \u0441\u0444\u0435\u0440\u0435 \u0438\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0438\u043E\u043D\u043D\u044B\u0445 \u0442\u0435\u0445\u043D\u043E\u043B\u043E\u0433\u0438\u0439. \u041C\u044B \u043F\u043E\u043B\u0443\u0447\u0438\u043B\u0438 \u0438\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0438\u044E \u043E \u0422\u0435\u0431\u0435 \u043A\u0430\u043A \u043E \u043E\u043F\u044B\u0442\u043D\u043E\u043C \u043F\u0440\u043E\u0433\u0440\u0430\u043C\u043C\u0438\u0441\u0442\u0435, \u0438 \u0445\u043E\u0442\u0435\u043B\u0438 \u0431\u044B \u043F\u0440\u0435\u0434\u043B\u043E\u0436\u0438\u0442\u044C \u0422\u0435\u0431\u0435 \u0441\u043E\u0442\u0440\u0443\u0434\u043D\u0438\u0447\u0435\u0441\u0442\u0432\u043E \u043F\u043E \u0441\u043E\u0437\u0434\u0430\u043D\u0438\u044E \u0431\u0443\u043A\u043B\u0435\u0442\u043E\u0432 \u0438 \u043B\u0438\u0441\u0442\u043E\u0432\u043E\u043A.</p>' +

          '<p style="margin:0 0 20px 0;">\u0415\u0441\u043B\u0438 \u0412\u044B \u0437\u0430\u0438\u043D\u0442\u0435\u0440\u0435\u0441\u043E\u0432\u0430\u043D\u044B \u0432 \u043F\u0440\u0435\u0434\u043B\u043E\u0436\u0435\u043D\u0438\u0438, \u0442\u043E \u043D\u0430\u043F\u0438\u0448\u0438\u0442\u0435 \u043D\u0430\u043C \u0432 \u043E\u0442\u0432\u0435\u0442\u043D\u043E\u043C \u043F\u0438\u0441\u044C\u043C\u0435, \u0447\u0442\u043E \u044F \u0433\u043E\u0442\u043E\u0432 \u0440\u0430\u0431\u043E\u0442\u0430\u0442\u044C.</p>' +

      body: '<p style="margin:0 0 12px 0;"><strong>\u0423\u0432\u0430\u0436\u0430\u0435\u043C\u044B\u0439 \u0425\u043B\u0435\u0431\u043D\u0438\u043A\u043E\u0432 \u0414\u0430\u043D\u0438\u0438\u043B!</strong></p>' +
        '<p style="margin:0 0 12px 0;"><strong>\u0414\u043E\u0431\u0440\u043E\u0435 \u0443\u0442\u0440\u043E!</strong></p>' +
        '<p style="margin:0 0 12px 0;">\u041C\u0435\u043D\u044F \u0437\u043E\u0432\u0443\u0442 <strong>\u0425\u0435\u0439\u0441\u0442\u043E\u0435\u043D\u0435\u043D \u0415\u0432\u0433\u0435\u043D\u0438\u044F \u0412\u043B\u0430\u0434\u0438\u043C\u0438\u0440\u043E\u0432\u043D\u0430</strong>, \u044F \u044F\u0432\u043B\u044F\u044E\u0441\u044C \u043A\u0443\u0440\u0430\u0442\u043E\u0440\u043E\u043C \u0433\u0440\u0443\u043F\u043F\u044B \u0432 <strong>\u041A\u043E\u043B\u043B\u0435\u0434\u0436\u0435 \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0438\u0437\u0430\u0446\u0438\u0438 \u0438 \u0438\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0438\u043E\u043D\u043D\u044B\u0445 \u0442\u0435\u0445\u043D\u043E\u043B\u043E\u0433\u0438\u0439 \u211620 (\u041A\u0410\u0418\u042220)</strong> \u0433\u043E\u0440\u043E\u0434\u0430 \u041C\u043E\u0441\u043A\u0432\u044B. \u041A \u043C\u043E\u0435\u043C\u0443 \u0441\u0432\u0435\u0434\u0435\u043D\u0438\u044E \u043F\u043E\u0441\u0442\u0443\u043F\u0438\u043B\u0430 \u0438\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0438\u044F \u043E\u0442 \u0426\u0435\u043D\u0442\u0440\u0430 \u0441\u043E\u0434\u0435\u0439\u0441\u0442\u0432\u0438\u044F \u0442\u0440\u0443\u0434\u043E\u0443\u0441\u0442\u0440\u043E\u0439\u0441\u0442\u0432\u0443 \u043E \u0442\u043E\u043C, \u0447\u0442\u043E \u0412\u044B \u043D\u0430\u0445\u043E\u0434\u0438\u0442\u0435\u0441\u044C \u0432 \u0430\u043A\u0442\u0438\u0432\u043D\u043E\u043C \u043F\u043E\u0438\u0441\u043A\u0435 \u0440\u0430\u0431\u043E\u0442\u044B \u043F\u043E \u0441\u043F\u0435\u0446\u0438\u0430\u043B\u044C\u043D\u043E\u0441\u0442\u0438 \u0432 \u0441\u0444\u0435\u0440\u0435 \u0438\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0438\u043E\u043D\u043D\u044B\u0445 \u0442\u0435\u0445\u043D\u043E\u043B\u043E\u0433\u0438\u0439 \u0438 \u043F\u0440\u043E\u0433\u0440\u0430\u043C\u043C\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u044F \u0441 \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u043D\u0438\u0435\u043C \u043D\u0430\u0448\u0435\u0439 \u0432\u043D\u0443\u0442\u0440\u0435\u043D\u043D\u0435\u0439 \u043F\u043B\u0430\u0442\u0444\u043E\u0440\u043C\u044B \u0442\u0440\u0443\u0434\u043E\u0443\u0441\u0442\u0440\u043E\u0439\u0441\u0442\u0432\u0430 <strong>\u041A\u0410\u0418\u042220</strong>.</p>' +
        '<p style="margin:0 0 12px 0;">\u0412 \u0441\u0432\u044F\u0437\u0438 \u0441 \u0432\u044B\u0448\u0435\u0438\u0437\u043B\u043E\u0436\u0435\u043D\u043D\u044B\u043C, \u0440\u0443\u043A\u043E\u0432\u043E\u0434\u0441\u0442\u0432\u043E \u043A\u043E\u043B\u043B\u0435\u0434\u0436\u0430 \u0438 \u043F\u043E\u0442\u0435\u043D\u0446\u0438\u0430\u043B\u044C\u043D\u044B\u0435 \u0440\u0430\u0431\u043E\u0442\u043E\u0434\u0430\u0442\u0435\u043B\u0438 \u0432\u044B\u0440\u0430\u0437\u0438\u043B\u0438 \u0437\u0430\u0438\u043D\u0442\u0435\u0440\u0435\u0441\u043E\u0432\u0430\u043D\u043D\u043E\u0441\u0442\u044C \u0432 \u0412\u0430\u0448\u0435\u0439 \u043A\u0430\u043D\u0434\u0438\u0434\u0430\u0442\u0443\u0440\u0435. \u041D\u0430 \u043E\u0441\u043D\u043E\u0432\u0430\u043D\u0438\u0438 \u044D\u0442\u043E\u0433\u043E \u0438\u043C\u0435\u044E \u0447\u0435\u0441\u0442\u044C \u043F\u0440\u0438\u0433\u043B\u0430\u0441\u0438\u0442\u044C \u0412\u0430\u0441 \u043D\u0430 <strong>\u0441\u043E\u0431\u0435\u0441\u0435\u0434\u043E\u0432\u0430\u043D\u0438\u0435</strong>, \u043A\u043E\u0442\u043E\u0440\u043E\u0435 \u0441\u043E\u0441\u0442\u043E\u0438\u0442\u0441\u044F <strong>14 \u0438\u044E\u043D\u044F 2026 \u0433\u043E\u0434\u0430 \u0432 12:00</strong> \u043F\u043E \u0430\u0434\u0440\u0435\u0441\u0443: <strong>\u0433. \u041C\u043E\u0441\u043A\u0432\u0430, \u0443\u043B. \u0410\u043A\u0430\u0434\u0435\u043C\u0438\u043A\u0430 \u0412\u0438\u043D\u043E\u0433\u0440\u0430\u0434\u043E\u0432\u0430, \u0434. 20, \u043A\u0430\u0431. 301</strong> (\u0433\u043B\u0430\u0432\u043D\u044B\u0439 \u043A\u043E\u0440\u043F\u0443\u0441 \u041A\u0410\u0418\u042220) \u0441 \u0432\u043E\u0437\u043C\u043E\u0436\u043D\u043E\u0441\u0442\u044C\u044E \u043F\u043E\u0434\u043A\u043B\u044E\u0447\u0435\u043D\u0438\u044F \u0432 \u0434\u0438\u0441\u0442\u0430\u043D\u0446\u0438\u043E\u043D\u043D\u043E\u043C \u0444\u043E\u0440\u043C\u0430\u0442\u0435.</p>' +
        '<p style="margin:0 0 12px 0;">\u0412 \u0445\u043E\u0434\u0435 \u0441\u043E\u0431\u0435\u0441\u0435\u0434\u043E\u0432\u0430\u043D\u0438\u044F \u043F\u043B\u0430\u043D\u0438\u0440\u0443\u0435\u0442\u0441\u044F \u043E\u0431\u0441\u0443\u0434\u0438\u0442\u044C \u0441\u043B\u0435\u0434\u0443\u044E\u0449\u0438\u0435 \u0432\u043E\u043F\u0440\u043E\u0441\u044B:</p>' +
        '<ol style="margin:0 0 12px 20px;">' +
          '<li>\u0412\u0430\u0448\u0438 \u043F\u0440\u043E\u0444\u0435\u0441\u0441\u0438\u043E\u043D\u0430\u043B\u044C\u043D\u044B\u0435 \u043A\u043E\u043C\u043F\u0435\u0442\u0435\u043D\u0446\u0438\u0438, \u043D\u0430\u0432\u044B\u043A\u0438 \u0438 \u043A\u0430\u0440\u044C\u0435\u0440\u043D\u044B\u0435 \u043F\u0440\u0435\u0434\u043F\u043E\u0447\u0442\u0435\u043D\u0438\u044F \u0432 \u043E\u0431\u043B\u0430\u0441\u0442\u0438 \u0440\u0430\u0437\u0440\u0430\u0431\u043E\u0442\u043A\u0438 \u043F\u0440\u043E\u0433\u0440\u0430\u043C\u043C\u043D\u043E\u0433\u043E \u043E\u0431\u0435\u0441\u043F\u0435\u0447\u0435\u043D\u0438\u044F.</li>' +
          '<li>\u0412\u043E\u0437\u043C\u043E\u0436\u043D\u044B\u0439 <strong>\u0444\u043E\u0440\u043C\u0430\u0442 \u0440\u0430\u0431\u043E\u0442\u044B</strong>: \u043F\u043E\u043B\u043D\u0430\u044F \u0443\u0434\u0430\u043B\u0451\u043D\u043D\u0430\u044F \u0437\u0430\u043D\u044F\u0442\u043E\u0441\u0442\u044C, \u0433\u0438\u0431\u0440\u0438\u0434\u043D\u044B\u0439 \u0433\u0440\u0430\u0444\u0438\u043A \u043B\u0438\u0431\u043E \u0440\u0430\u0431\u043E\u0442\u0430 \u043D\u0430 \u0442\u0435\u0440\u0440\u0438\u0442\u043E\u0440\u0438\u0438 \u0440\u0430\u0431\u043E\u0442\u043E\u0434\u0430\u0442\u0435\u043B\u044F.</li>' +

          '<li>\u041F\u0440\u0435\u0434\u043F\u043E\u043B\u0430\u0433\u0430\u0435\u043C\u044B\u0439 \u043A\u0440\u0443\u0433 \u0434\u043E\u043B\u0436\u043D\u043E\u0441\u0442\u043D\u044B\u0445 \u043E\u0431\u044F\u0437\u0430\u043D\u043D\u043E\u0441\u0442\u0435\u0439 \u0438 \u0441\u0442\u0435\u043A \u0442\u0435\u0445\u043D\u043E\u043B\u043E\u0433\u0438\u0439, \u0441 \u043A\u043E\u0442\u043E\u0440\u044B\u043C\u0438 \u043F\u0440\u0435\u0434\u0441\u0442\u043E\u0438\u0442 \u0440\u0430\u0431\u043E\u0442\u0430\u0442\u044C.</li>' +
          '<li>\u0413\u0440\u0430\u0444\u0438\u043A \u0440\u0430\u0431\u043E\u0442\u044B, \u0440\u0435\u0436\u0438\u043C \u0440\u0430\u0431\u043E\u0447\u0435\u0433\u043E \u0432\u0440\u0435\u043C\u0435\u043D\u0438 \u0438 \u0441\u0438\u0441\u0442\u0435\u043C\u0430 \u043E\u0442\u0447\u0451\u0442\u043D\u043E\u0441\u0442\u0438.</li>' +

        '<p style="margin:0 0 12px 0;">\u041D\u0430 \u0432\u0441\u0442\u0440\u0435\u0447\u0435 \u0412\u044B \u0441\u043C\u043E\u0436\u0435\u0442\u0435 <strong>\u043B\u0438\u0447\u043D\u043E \u043F\u043E\u043E\u0431\u0449\u0430\u0442\u044C\u0441\u044F \u0441 \u0432\u0430\u0448\u0438\u043C \u043F\u043E\u0442\u0435\u043D\u0446\u0438\u0430\u043B\u044C\u043D\u044B\u043C \u0440\u0430\u0431\u043E\u0442\u043E\u0434\u0430\u0442\u0435\u043B\u0435\u043C</strong>, \u0437\u0430\u0434\u0430\u0442\u044C \u0432\u0441\u0435 \u0438\u043D\u0442\u0435\u0440\u0435\u0441\u0443\u044E\u0449\u0438\u0435 \u0412\u0430\u0441 \u0432\u043E\u043F\u0440\u043E\u0441\u044B, \u0443\u0442\u043E\u0447\u043D\u0438\u0442\u044C \u0434\u0435\u0442\u0430\u043B\u0438 \u0432\u0430\u043A\u0430\u043D\u0441\u0438\u0438 \u0438 \u043E\u043F\u0440\u0435\u0434\u0435\u043B\u0438\u0442\u044C, \u043A\u0430\u043A\u043E\u0435 \u043D\u0430\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u0438\u0435 \u0434\u0435\u044F\u0442\u0435\u043B\u044C\u043D\u043E\u0441\u0442\u0438 \u043F\u043E\u0434\u0445\u043E\u0434\u0438\u0442 \u0412\u0430\u043C \u0432 \u043D\u0430\u0438\u0431\u043E\u043B\u044C\u0448\u0435\u0439 \u0441\u0442\u0435\u043F\u0435\u043D\u0438. \u0420\u0430\u0431\u043E\u0442\u043E\u0434\u0430\u0442\u0435\u043B\u044C \u0431\u0443\u0434\u0435\u0442 \u0433\u043E\u0442\u043E\u0432 \u043F\u043E\u0434\u0440\u043E\u0431\u043D\u043E \u0440\u0430\u0441\u0441\u043A\u0430\u0437\u0430\u0442\u044C \u043E \u0442\u0435\u043A\u0443\u0449\u0438\u0445 \u043F\u0440\u043E\u0435\u043A\u0442\u0430\u0445, \u043A\u043E\u0440\u043F\u043E\u0440\u0430\u0442\u0438\u0432\u043D\u043E\u0439 \u043A\u0443\u043B\u044C\u0442\u0443\u0440\u0435 \u0438 \u0442\u0440\u0435\u0431\u043E\u0432\u0430\u043D\u0438\u044F\u0445 \u043A \u043A\u0430\u043D\u0434\u0438\u0434\u0430\u0442\u0430\u043C.</p>' +

  function playNotificationSound() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      // First beep
      var osc1 = ctx.createOscillator();
      var gain1 = ctx.createGain();
      osc1.connect(gain1);
      gain1.connect(ctx.destination);
      osc1.frequency.setValueAtTime(880, ctx.currentTime);
      osc1.type = 'sine';
      gain1.gain.setValueAtTime(0.3, ctx.currentTime);
      gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);

      // Second beep (slightly higher)
      var osc2 = ctx.createOscillator();
      var gain2 = ctx.createGain();
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.frequency.setValueAtTime(1100, ctx.currentTime + 0.15);
      osc2.type = 'sine';
      gain2.gain.setValueAtTime(0, ctx.currentTime);
      gain2.gain.setValueAtTime(0.3, ctx.currentTime + 0.15);
      gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);

      osc1.start(ctx.currentTime);
      osc1.stop(ctx.currentTime + 0.15);
      osc2.start(ctx.currentTime + 0.15);
      osc2.stop(ctx.currentTime + 0.35);
    } catch(e) {}
  }

  // ===== STATE =====
  var currentFolder = 'inbox';
  var allEmails = JSON.parse(JSON.stringify(EMAILS));

  // ===== RENDER LIST =====
  function renderList(emails) {
    var list = document.getElementById('emailList');
    var count = document.getElementById('mailCount');
    list.innerHTML = '';

    if (emails.length === 0) {
      list.innerHTML = '<div style="padding:60px 20px;text-align:center;color:#8E9CAB;"><div style="font-size:40px;margin-bottom:12px;">&#128236;</div>Нет писем</div>';
      count.textContent = '0 писем';
      return;
    }

    var total = allEmails.filter(function(e) { return e.folder === currentFolder; }).length;
    count.textContent = '1\u2013' + emails.length + ' из ' + total;

    for (var i = 0; i < emails.length; i++) {
      var e = emails[i];
      var row = document.createElement('div');
      row.className = 'email-row' + (e.unread ? ' unread' : '');
      row.dataset.id = e.id;

      var infoMatch = e.from.match(/^([A-ZА-ЯЁ])/);
      var initial = infoMatch ? infoMatch[1] : '?';

      var labelHtml = e.label ? '<span class="label ' + e.label + '">' + e.label + '</span>' : '';
      var flagHtml = e.flagged ? '<span class="pin-icon">&#9733;</span>' : '';

      row.innerHTML =
        '<div class="cb"><input type="checkbox" onclick="event.stopPropagation()"></div>' +
        '<div class="avatar-wrap"><div class="avatar ' + e.avatarClass + '">' + initial + '</div></div>' +
        '<div class="from-wrap"><div class="from">' + escHtml(e.from) + '</div></div>' +
        '<div class="subject-wrap">' +
          flagHtml +
          labelHtml +
          '<div class="subject">' + escHtml(e.subject) + '</div>' +
        '</div>' +
        '<div class="date-wrap">' +
          '<span class="date-text">' + escHtml(e.dateLabel) + '</span>' +
        '</div>';

      (function(id) {
        row.addEventListener('click', function(ev) {
          if (ev.target.type === 'checkbox') return;
          openEmail(id);
        });
      })(e.id);

      list.appendChild(row);
    }
  }

  function escHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ===== FILTER =====
  function filterEmails(query) {
    var q = query.toLowerCase().trim();
    var filtered = allEmails.filter(function(e) { return e.folder === currentFolder; });
    if (q) {
      filtered = filtered.filter(function(e) {
        return e.from.toLowerCase().indexOf(q) !== -1 ||
               e.subject.toLowerCase().indexOf(q) !== -1 ||
               (e.body && e.body.toLowerCase().indexOf(q) !== -1);
      });
    }
    renderList(filtered);
  }

  // ===== FOLDER SWITCH =====
  function switchFolder(el) {
    var items = document.querySelectorAll('.nav-item');
    for (var i = 0; i < items.length; i++) items[i].classList.remove('active');
    el.classList.add('active');
    currentFolder = el.dataset.folder;
    closeEmail();
    var filtered = allEmails.filter(function(e) { return e.folder === currentFolder; });
    renderList(filtered);
    updateBadge();
  }

  function updateBadge() {
    var badge = document.getElementById('inboxBadge');
    var cnt = 0;
    for (var i = 0; i < allEmails.length; i++) {
      if (allEmails[i].folder === 'inbox' && allEmails[i].unread) cnt++;
    }
    badge.textContent = cnt;
    badge.style.display = cnt > 0 ? 'inline' : 'none';
  }

  // ===== OPEN / CLOSE EMAIL =====
  function openEmail(id) {
    var e = null;
    for (var i = 0; i < allEmails.length; i++) {
      if (allEmails[i].id === id) { e = allEmails[i]; break; }
    }
    if (!e) return;

    currentEmailId = id;
    e.unread = false;
    updateBadge();

    document.getElementById('emailList').style.display = 'none';
    var reader = document.getElementById('emailReader');
    reader.classList.add('open');
    reader.style.display = 'flex';
    document.getElementById('readerBack').style.display = 'inline-flex';

    document.getElementById('readerSubject').textContent = e.subject;
    document.getElementById('readerDate').textContent = e.dateFull;
    var av = document.getElementById('readerAvatar');
    av.textContent = e.avatar;
    av.className = 'avatar ' + e.avatarClass;
    document.getElementById('readerName').textContent = e.from;
    document.getElementById('readerEmail').textContent = e.emailFrom;
    document.getElementById('readerTo').textContent = e.to || 'hlebnikovdanya2006@gmail.com';

    var bodyDiv = document.getElementById('readerBody');
    if (e.bodyHtml) {
      bodyDiv.innerHTML = e.body;
    } else {
      bodyDiv.innerHTML = e.body.replace(/\n/g, '<br>');
    }

    document.getElementById('readerScroll').scrollTop = 0;

    var filtered = allEmails.filter(function(m) { return m.folder === currentFolder; });
    renderList(filtered);
  }

  function closeEmail() {
    currentEmailId = null;
    document.getElementById('emailList').style.display = 'block';
    var reader = document.getElementById('emailReader');
    reader.classList.remove('open');
    reader.style.display = 'none';
    document.getElementById('readerBack').style.display = 'none';
  }

  // ===== TOOLBAR =====
  function toggleSelectAll() {
    var checked = document.getElementById('selectAllCb').checked;
    var cbs = document.querySelectorAll('.email-row .cb input');
    for (var i = 0; i < cbs.length; i++) cbs[i].checked = checked;
  }

  function deleteSelected() {
    var cbs = document.querySelectorAll('.email-row .cb input:checked');
    if (cbs.length === 0) { showToast('Выберите письма для удаления'); return; }
    for (var i = 0; i < cbs.length; i++) {
      var row = cbs[i].closest('.email-row');
      if (row) {
        var id = row.dataset.id;
        for (var j = 0; j < allEmails.length; j++) {
          if (allEmails[j].id === id) { allEmails[j].folder = 'trash'; break; }
        }
      }
    }
    var filtered = allEmails.filter(function(e) { return e.folder === currentFolder; });
    renderList(filtered);
    updateBadge();
    showToast('Удалено');
    document.getElementById('selectAllCb').checked = false;
  }

  function markRead() {
    var cbs = document.querySelectorAll('.email-row .cb input:checked');
    if (cbs.length === 0) { showToast('Выберите письма'); return; }
    for (var i = 0; i < cbs.length; i++) {
      var row = cbs[i].closest('.email-row');
      if (row) {
        var id = row.dataset.id;
        for (var j = 0; j < allEmails.length; j++) {
          if (allEmails[j].id === id) { allEmails[j].unread = false; break; }
        }
      }
    }
    var filtered = allEmails.filter(function(e) { return e.folder === currentFolder; });
    renderList(filtered);
    updateBadge();
    showToast('Помечено как прочитано');
  }

  function markUnread() {
    var cbs = document.querySelectorAll('.email-row .cb input:checked');
    if (cbs.length === 0) { showToast('Выберите письма'); return; }
    for (var i = 0; i < cbs.length; i++) {
      var row = cbs[i].closest('.email-row');
      if (row) {
        var id = row.dataset.id;
        for (var j = 0; j < allEmails.length; j++) {
          if (allEmails[j].id === id) { allEmails[j].unread = true; break; }
        }
      }
    }
    var filtered = allEmails.filter(function(e) { return e.folder === currentFolder; });
    renderList(filtered);
    updateBadge();
    showToast('Помечено как непрочитанное');
  }

  // ===== CURRENT EMAIL ID FOR REPLY =====
  var currentEmailId = null;

  // ===== COMPOSE =====
  function openCompose() {
    document.getElementById('composeTo').value = '';
    document.getElementById('composeModal').classList.add('open');
    document.getElementById('composeSubject').value = '';
    document.getElementById('composeBody').value = '';
  }

  function replyToCurrent() {
    if (!currentEmailId) { showToast('Сначала откройте письмо'); return; }
    var e = null;
    for (var i = 0; i < allEmails.length; i++) {
      if (allEmails[i].id === currentEmailId) { e = allEmails[i]; break; }
    }
    if (!e) return;
    document.getElementById('composeTo').value = e.emailFrom || '';
    document.getElementById('composeSubject').value = 'Re: ' + e.subject;
    document.getElementById('composeBody').value = '';
    document.getElementById('composeModal').classList.add('open');
  }

  function closeCompose() {
    document.getElementById('composeModal').classList.remove('open');
  }

  function sendMail() {
    var toEmail = document.getElementById('composeTo').value || 'Неизвестный адрес';
    showToast('\u2709 \u041F\u0438\u0441\u044C\u043C\u043E \u043E\u0442\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u043E \u043D\u0430 ' + toEmail);
    closeCompose();
    allEmails.push({
      id: 'sent-' + Date.now(),
      folder: 'sent',
      unread: false,
      flagged: false,
      avatar: '\u0414\u0425',
      avatarClass: 'red',
      from: '\u0425\u043B\u0435\u0431\u043D\u0438\u043A\u043E\u0432 \u0414\u0430\u043D\u0438\u0438\u043B',
      emailFrom: 'hlebnikovdanya2006@gmail.com',
      subject: document.getElementById('composeSubject').value || '(\u0431\u0435\u0437 \u0442\u0435\u043C\u044B)',
      dateLabel: '\u0442\u043E\u043B\u044C\u043A\u043E \u0447\u0442\u043E',
      dateFull: '\u0442\u043E\u043B\u044C\u043A\u043E \u0447\u0442\u043E',
      to: toEmail,
      body: '<p style="margin:0;">' + escHtml(document.getElementById('composeBody').value || '...').replace(/\n/g, '<br>') + '</p>',
      bodyHtml: true
    });
  }

  // ===== TOAST =====
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function() { t.classList.remove('show'); }, 2200);
  }

  // ===== NOTIFICATION BANNER TIMER =====
  var notifTimer = null;

  function hideNotifBanner() {
    var banner = document.getElementById('notifBanner');
    banner.classList.remove('show');
  }

  // ===== ADD DELAYED EMAIL =====
  function addDelayedEmail() {
    allEmails.unshift(DELAYED_EMAIL);
    playNotificationSound();

    var banner = document.getElementById('notifBanner');
    banner.classList.add('show');
    clearTimeout(notifTimer);
    notifTimer = setTimeout(hideNotifBanner, 5000);

    var filtered = allEmails.filter(function(e) { return e.folder === 'inbox'; });
    renderList(filtered);
    updateBadge();

    var rows = document.querySelectorAll('.email-row');
    if (rows.length > 0) {
      rows[0].classList.add('new-email');
    }

    showToast('\uD83D\uDCE8 Новое письмо от Кубановой О. Н. — тестирование перед собеседованием');
  }

  // ===== INIT =====
  document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('emailReader').style.display = 'none';
    var list = document.getElementById('emailList');
    list.innerHTML = '<div style="padding:60px 20px;text-align:center;color:#8E9CAB;"><div style="font-size:40px;margin-bottom:12px;">&#128236;</div>Загрузка писем...</div>';
    document.getElementById('mailCount').textContent = 'загрузка...';
    setTimeout(function() {
      var filtered = allEmails.filter(function(e) { return e.folder === 'inbox'; });
      renderList(filtered);
      updateBadge();
    }, 5000);
  });

  document.getElementById('composeModal').addEventListener('click', function(e) {
    if (e.target === this) closeCompose();
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { closeCompose(); closeEmail(); }
  });
</script>
